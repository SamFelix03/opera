[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [{ access = "read", path = "./"}]

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"

[etherscan]
monad = { key = "verifycontract", url = "https://testnet.monadvision.com/api" }
